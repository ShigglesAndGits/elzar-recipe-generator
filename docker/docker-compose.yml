version: '3.8'

services:
  elzar:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: elzar
    restart: unless-stopped
    ports:
      - "${ELZAR_PORT:-80}:80"
    environment:
      # Grocy Configuration (Required)
      - GROCY_URL=${GROCY_URL}
      - GROCY_API_KEY=${GROCY_API_KEY}

      # LLM Configuration (Required)
      - LLM_API_URL=${LLM_API_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}

      # Vision Model Configuration (Optional - falls back to LLM settings)
      - VISION_API_URL=${VISION_API_URL:-}
      - VISION_API_KEY=${VISION_API_KEY:-}
      - VISION_MODEL=${VISION_MODEL:-}

      # Optional Settings
      - MAX_RECIPE_HISTORY=${MAX_RECIPE_HISTORY:-50}
      - APPRISE_URL=${APPRISE_URL:-}
      - UNIT_PREFERENCE=${UNIT_PREFERENCE:-imperial}
    volumes:
      # Persist SQLite database and exported recipes
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
