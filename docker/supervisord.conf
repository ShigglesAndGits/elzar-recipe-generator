[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/nginx/error.log
stdout_logfile=/var/log/nginx/access.log
priority=10

[program:uvicorn]
command=python -m uvicorn app.main:app --host 127.0.0.1 --port 8001
directory=/app
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/supervisor/uvicorn.err.log
stdout_logfile=/var/log/supervisor/uvicorn.out.log
environment=PYTHONUNBUFFERED="1"
priority=20

[eventlistener:process_exit]
command=/bin/sh -c "echo READY && while read line; do echo RESULT 2; echo STOPPING; kill -SIGTERM $(cat /var/run/supervisord.pid); done"
events=PROCESS_STATE_FATAL
buffer_size=10
